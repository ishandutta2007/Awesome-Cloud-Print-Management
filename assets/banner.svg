<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glowing Drop Shadow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <style>
      /* Keyframe Animations */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatOpposite {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes printPageFlow {
        0% { transform: translateY(-15px); opacity: 0; }
        25% { opacity: 0.9; }
        75% { opacity: 0.9; }
        100% { transform: translateY(35px); opacity: 0; }
      }

      .pulse-orb {
        transform-origin: center;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .float-group-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .float-group-2 {
        animation: floatOpposite 6s ease-in-out infinite;
      }
      .data-stream {
        stroke-dasharray: 6 6;
        animation: dashFlow 2s linear infinite;
      }
      .print-page {
        animation: printPageFlow 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Animated Glowing Ambient Orbs (Background layer) -->
  <circle cx="150" cy="100" r="140" fill="#0284c7" opacity="0.15" filter="url(#glowCyan)" class="pulse-orb" />
  <circle cx="1060" cy="300" r="160" fill="#7c3aed" opacity="0.15" filter="url(#glowCyan)" class="pulse-orb" style="animation-delay: -3s;" />
  <circle cx="950" cy="110" r="100" fill="#06b6d4" opacity="0.12" filter="url(#glowCyan)" class="pulse-orb" style="animation-delay: -1.5s;" />

  <!-- Connecting Dynamic Data Circuit Lines -->
  <g opacity="0.5">
    <path d="M 120 340 C 260 340, 280 370, 450 370" fill="none" stroke="#0ea5e9" stroke-width="2" class="data-stream" />
    <path d="M 750 370 C 880 370, 920 340, 1080 340" fill="none" stroke="#8b5cf6" stroke-width="2" class="data-stream" />
  </g>

  <!-- Left Futuristic Cloud Printing Visual Component -->
  <g class="float-group-1" transform="translate(100, 160)">
    <!-- Outer Glow Badge / Plate -->
    <rect x="-10" y="-10" width="130" height="110" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="2" opacity="0.85" />
    <!-- Stylized Cloud -->
    <path d="M 30 50 A 18 18 0 0 1 65 42 A 24 24 0 0 1 95 62 A 16 16 0 0 1 85 78 L 30 78 A 16 16 0 0 1 30 50 Z"
          fill="url(#cyanGrad)" opacity="0.9" filter="url(#glowSoft)"/>
    <!-- Signal waves -->
    <path d="M 55 24 A 32 32 0 0 1 78 30" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 50 14 A 45 45 0 0 1 85 22" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Right Futuristic Smart Printer & Secure Release Visual Component -->
  <g class="float-group-2" transform="translate(980, 150)">
    <!-- Device Plate -->
    <rect x="-15" y="-10" width="140" height="125" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="2" opacity="0.85" />
    
    <!-- Printer Base Enclosure -->
    <rect x="15" y="45" width="80" height="45" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <rect x="25" y="32" width="60" height="15" rx="4" fill="#334155" />
    <!-- Paper Feed Slot -->
    <line x1="28" y1="58" x2="82" y2="58" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#glowSoft)"/>
    <!-- Status LED -->
    <circle cx="85" cy="74" r="3" fill="#10b981" filter="url(#glowSoft)"/>

    <!-- Animated Document Flowing from Cloud / Print Slot -->
    <g class="print-page">
      <rect x="35" y="62" width="40" height="30" rx="3" fill="#ffffff" opacity="0.95" filter="url(#glowSoft)" />
      <line x1="40" y1="70" x2="68" y2="70" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
      <line x1="40" y1="76" x2="62" y2="76" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <line x1="40" y1="82" x2="55" y2="82" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Center Foreground Header (Dominant, Crisp, High-Contrast) -->
  <g id="header-foreground">
    <!-- Category Pill Tag -->
    <g transform="translate(600, 75)">
      <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
      <circle cx="-140" cy="0" r="4.5" fill="#38bdf8" filter="url(#glowSoft)" />
      <text x="5" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
            font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
        CLOUD-NATIVE &amp; SERVERLESS PRINTING
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="155" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5" filter="url(#glowSoft)">
      Awesome Cloud Print Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="200" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="0.3">
      Zero-Trust Routing &#8226; Pull Printing &#8226; Multi-Tenant Fleets &#8226; Open-Source Infrastructure
    </text>

    <!-- Interactive / Feature Feature Tags Row -->
    <g transform="translate(600, 260)">
      <!-- Pill 1 -->
      <g transform="translate(-240, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">☁️ Serverless</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-80, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">🔒 Secure Pull</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(80, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">💻 ChromeOS &amp; VDI</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(240, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚙️ CUPS &amp; IPP</text>
      </g>
    </g>

    <!-- Bottom Stat Bar Divider -->
    <g transform="translate(600, 320)">
      <line x1="-320" y1="0" x2="320" y2="0" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="-160" cy="0" r="3" fill="#38bdf8"/>
      <circle cx="0" cy="0" r="3" fill="#818cf8"/>
      <circle cx="160" cy="0" r="3" fill="#c084fc"/>
    </g>

    <!-- Bottom Metric / Tagline -->
    <text x="600" y="360" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="13" font-weight="500" fill="#64748b" letter-spacing="1">
      ELIMINATE ON-PREMISES PRINT SERVERS &#8226; SCALE DISTRIBUTED INFRASTRUCTURE
    </text>
  </g>
</svg>
